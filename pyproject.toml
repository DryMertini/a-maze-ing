[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator with DFS craving and IDDFS solving"
requires-python = ">=3.10"
authors = [{name = "achafai"}, {name = "maslan"}]

[tool.setuptools]
packages = ["mazegen"]